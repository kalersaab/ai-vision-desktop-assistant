[package]
name = "vision-desk"
version = "0.1.0"
description = "Local AI vision desktop assistant"
authors = ["AI Vision Desktop Assistant"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
